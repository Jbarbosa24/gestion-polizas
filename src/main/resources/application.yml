server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false
app:
  api-key: ${API_KEY:123456}
  core:
    url: ${CORE_URL:http://localhost:8080/core-mock/evento}
logging:
  level:
    com.evaluacion.polizas: INFO
